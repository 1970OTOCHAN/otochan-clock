<head>
<meta charset="utf-8">

<title>日本100名城マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html, body { margin:0; height:100%; font-family: "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; }
  #bar { position:absolute; top:0; left:0; right:0; z-index:1000; display:flex; align-items:center; gap:10px;
         flex-wrap:wrap; padding:8px 12px; background:#3b2a1a; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  #bar h1 { font-size:18px; margin:0; font-weight:700; }
  #count { background:#c0392b; padding:3px 10px; border-radius:12px; font-size:14px; font-weight:700; }
  #bar select, #bar label { font-size:14px; }
  #bar select { padding:3px; }
  #map { position:absolute; top:48px; left:0; right:0; bottom:0; }
  .castle { font-size:22px; line-height:30px; text-align:center; width:30px; height:30px; border-radius:50%;
            background:#fff; border:2px solid #3b2a1a; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .castle.visited { background:#ffd84d; border-color:#c0392b; }
  .castle.visited::after { content:"✓"; position:absolute; right:-6px; top:-6px; background:#c0392b; color:#fff;
            font-size:12px; line-height:16px; width:16px; height:16px; border-radius:50%; font-weight:700; }
  .pop { width:260px; }
  .pop h2 { margin:0 0 2px; font-size:17px; }
  .pop .pref { color:#666; font-size:13px; margin-bottom:6px; }
  .pop .photo { width:260px; min-height:60px; background:#eee; display:flex; align-items:center; justify-content:center;
                color:#888; font-size:13px; border-radius:4px; overflow:hidden; }
  .pop .photo img { width:100%; display:block; }
  .pop .credit { font-size:11px; color:#777; margin-top:3px; line-height:1.4; }
  .pop button { margin-top:8px; width:100%; padding:9px; font-size:15px; border:none; border-radius:6px;
                cursor:pointer; background:#3b2a1a; color:#fff; font-weight:700; }
  .pop button.on { background:#c0392b; }
  .leaflet-popup-content { margin:10px; }
</style>
</head>
<body>

  <select id="jump"><option value="">城を選んで移動…</option></select>
  <label><input type="checkbox" id="onlyNot"> 未訪問だけ表示</label>

<div id="map"></div>

[98,"今帰仁城","沖縄県",26.6910,127.9290,"今帰仁城"],
[99,"中城城","沖縄県",26.2830,127.8010,"中城城"],
[100,"首里城","沖縄県",26.2170,127.7190,"首里城"]
];

// ---- 訪問記録（このブラウザに保存） ----
const KEY = "meijo100_visited";
let visited = new Set();
try { visited = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function saveVisited(){ try { localStorage.setItem(KEY, JSON.stringify([...visited])); } catch(e) {} }
function updateCount(){ document.getElementById("count").textContent = `訪問 ${visited.size} / 100`; }

// ---- 地図（国土地理院タイル） ----
const gsiAttr = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>';
const layers = {
  "標準地図": L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {attribution:gsiAttr, maxZoom:18}),
  "淡色地図": L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {attribution:gsiAttr, maxZoom:18}),
  "写真":     L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {attribution:gsiAttr, maxZoom:18})
};
const map = L.map("map", { layers:[layers["標準地図"]] }).setView([36.5, 136.0], 5);
L.control.layers(layers, null, {collapsed:false}).addTo(map);

function makeIcon(no){
  return L.divIcon({ className:"", iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-14],
    html:`<div class="castle${visited.has(no) ? " visited" : ""}" style="position:relative">🏯</div>` });
}

// ---- 写真（Wikipedia / ウィキメディア・コモンズ） ----
const photoCache = {};
function stripHtml(h){ const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.trim(); }
async function getPhoto(title){
  if (photoCache[title]) return photoCache[title];
  const api = "https://ja.wikipedia.org/w/api.php?format=json&origin=*&action=query";
  const r1 = await fetch(`${api}&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=640&titles=${encodeURIComponent(title)}`).then(r=>r.json());
  const page = Object.values(r1.query.pages)[0];
  const info = { pageUrl:`https://ja.wikipedia.org/wiki/${encodeURIComponent(page.title || title)}` };
  if (page.thumbnail) {
    info.src = page.thumbnail.source;
    try {
      const r2 = await fetch(`${api}&prop=imageinfo&iiprop=extmetadata|url&titles=${encodeURIComponent("File:" + page.pageimage)}`).then(r=>r.json());
      const ii = Object.values(r2.query.pages)[0].imageinfo[0];
      info.fileUrl = ii.descriptionurl;
      info.artist = stripHtml(ii.extmetadata.Artist && ii.extmetadata.Artist.value);
      info.license = stripHtml(ii.extmetadata.LicenseShortName && ii.extmetadata.LicenseShortName.value);
    } catch(e) {}
  }
  photoCache[title] = info;
  return info;
}

// ---- マーカー ----
const markers = {};
const jump = document.getElementById("jump");
CASTLES.forEach(([no, name, pref, lat, lng, wiki]) => {
  const m = L.marker([lat, lng], { icon: makeIcon(no), title: `${no} ${name}` });

  const box = document.createElement("div");
  box.className = "pop";
  box.innerHTML = `<h2>${no}. ${name}</h2><div class="pref">${pref}</div>
    <div class="photo">写真を読み込み中…</div><div class="credit"></div><button></button>`;
  const btn = box.querySelector("button");
  function paintBtn(){
    const v = visited.has(no);
    btn.textContent = v ? "✓ 行った！（タップで取り消し）" : "行ったところに印を付ける";
    btn.className = v ? "on" : "";
  }
  btn.onclick = () => {
    visited.has(no) ? visited.delete(no) : visited.add(no);
    saveVisited(); updateCount(); paintBtn(); m.setIcon(makeIcon(no)); applyFilter();
  };
  paintBtn();
  m.bindPopup(box, { maxWidth: 280 });

  let loaded = false;
  m.on("popupopen", async () => {
    if (loaded) return; loaded = true;
    const photo = box.querySelector(".photo"), credit = box.querySelector(".credit");
    try {
      const p = await getPhoto(wiki);
      if (p.src) {
        const img = new Image();
        img.onload = () => m.getPopup().update();
        img.src = p.src; img.alt = name;
        photo.innerHTML = ""; photo.appendChild(img);
        const who = [p.artist, p.license].filter(Boolean).join(" / ");
        credit.innerHTML = `写真：<a href="${p.fileUrl || p.pageUrl}" target="_blank">ウィキメディア・コモンズ</a>${who ? "（" + who.replace(/</g,"&lt;") + "）" : ""}
          ・<a href="${p.pageUrl}" target="_blank">Wikipediaで詳しく</a>`;
      } else {
        photo.textContent = "写真が見つかりませんでした";
        credit.innerHTML = `<a href="${p.pageUrl}" target="_blank">Wikipediaで見る</a>`;
      }
    } catch(e) {
      photo.textContent = "写真を読み込めませんでした（インターネット接続を確認してください）";
    }
    m.getPopup().update();
  });

  m.addTo(map);
  markers[no] = m;
  const opt = document.createElement("option");
  opt.value = no; opt.textContent = `${no}. ${name}（${pref}）`;
  jump.appendChild(opt);
});

jump.onchange = () => {
  const no = Number(jump.value); if (!no) return;
  const m = markers[no];
  if (!map.hasLayer(m)) m.addTo(map);
  map.setView(m.getLatLng(), 14); m.openPopup();
};

const onlyNot = document.getElementById("onlyNot");
function applyFilter(){
  CASTLES.forEach(([no]) => {
    const m = markers[no], hide = onlyNot.checked && visited.has(no);
    if (hide && map.hasLayer(m) && !m.isPopupOpen()) map.removeLayer(m);
    if (!hide && !map.hasLayer(m)) m.addTo(map);
  });
}
onlyNot.onchange = applyFilter;
updateCount();
</script>
</body>
</html>
